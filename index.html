
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="❤️">
  <title>For Bea <3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #111111;
      --white: #ffffff;
      --gray: #777777;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--white);
      color: var(--black);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top))
               24px
               max(24px, env(safe-area-inset-bottom));
      text-align: center;
      background: white;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    .eyebrow {
      margin-bottom: 16px;
      color: var(--gray);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(29px, 8vw, 38px);
      font-weight: 650;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 30px;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }

    .primary {
      min-height: 54px;
      padding: 0 28px;
      border: 1px solid var(--black);
      border-radius: 12px;
      background: var(--black);
      color: white;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }

    .primary:active {
      transform: scale(0.97);
    }

    .question {
      width: 100%;
      max-width: 360px;
    }

    .question h1 {
      margin-bottom: 36px;
      font-size: clamp(29px, 8vw, 36px);
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .choice {
      min-width: 0;
      width: 50%;
      min-height: 54px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }

    #yes {
      border: 1px solid var(--black);
      background: var(--black);
      color: white;
    }

    #no {
      border: 1px solid #e5e5e5;
      background: white;
      color: var(--black);
    }

    .hint {
      margin-top: 26px;
      font-size: 12px;
      color: #999;
    }

    #celebration {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background: white;
    }

    #celebration h1 {
      margin-bottom: 18px;
    }

    #celebration p {
      margin-bottom: 26px;
    }

    .heart {
      margin-bottom: 20px;
      font-size: 36px;
    }

    @media (max-width: 380px) {
      .buttons {
        gap: 10px;
      }

      .choice {
        min-height: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- TELA INICIAL -->
  <main id="welcome" class="screen">
    <div class="eyebrow"></div>
    <h1>Welcome, Bea Hipotética</h1>
    <p>Pergunta hipotética também</p>
    <button id="start" class="primary">
      Clique para continuar
    </button>
  </main>

  <!-- TELA DA PERGUNTA -->
  <section id="ask" class="screen hidden">
    <div class="question">
      <div class="eyebrow">Papo reto pô</div>
      <h1>Aceita sair comigo?</h1>

      <div class="buttons" id="buttonArea">
        <button id="yes" class="choice">Sim</button>
        <button id="no" class="choice">Não</button>
      </div>

      <div class="hint" id="hint">
        Escolha uma das opções :)
      </div>
    </div>
  </section>

  <!-- FINAL OPCIONAL, CASO QUEIRA ACEITAR O SIM -->
  <section id="celebration" class="hidden">
    <div>
      <div class="heart"></div>
      <h1>Querias clicar o não, né?</h1>
      <button id="confirmDate" class="primary">
        KKKKKK❤️🫵🏼
      </button>
    </div>
  </section>

  <script>
    const welcome = document.getElementById("welcome");
    const ask = document.getElementById("ask");
    const celebration = document.getElementById("celebration");

    const start = document.getElementById("start");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const hint = document.getElementById("hint");

    const whatsappNumber = "5547997695689";
    const whatsappMessage = "Sai do meu pé, chulé KKKKKK";

    let attempts = 0;
    let escapeMode = true;

    start.addEventListener("click", () => {
      welcome.classList.add("hidden");
      ask.classList.remove("hidden");
    });

    function moveYesButton() {
      attempts++;

      // Após alguns cliques, o botão pode finalmente ser aceito.
      // Altere 8 para outro número, se quiser.
      if (attempts >= 8) {
        escapeMode = false;
        hint.textContent = "Mais convicção";
        return;
      }

      // Transforma o botão em um elemento de posição livre na tela.
      const rect = yes.getBoundingClientRect();
      const margin = 16;

      yes.style.position = "fixed";
      yes.style.width = Math.min(rect.width, window.innerWidth - 32) + "px";
      yes.style.zIndex = "10";

      const maxX = Math.max(
        margin,
        window.innerWidth - rect.width - margin
      );

      const maxY = Math.max(
        margin + 50,
        window.innerHeight - rect.height - margin
      );

      let x, y;
      let tries = 0;

      do {
        x = margin + Math.random() * (maxX - margin);
        y = margin + Math.random() * (maxY - margin);
        tries++;
      } while (
        tries < 20 &&
        Math.abs(x - rect.left) < 100 &&
        Math.abs(y - rect.top) < 80
      );

      yes.style.left = x + "px";
      yes.style.top = y + "px";

      const messages = [
        "Opa, quase!",
        "Eita, errooouu!",
        "Tenta de novo",
        "Esse botão é tímido!",
        "Calma, emocionada",
        "Aceita logo!",
        "Última tentativa?"
      ];

      hint.textContent =
        messages[Math.min(attempts - 1, messages.length - 1)];
    }

    yes.addEventListener("click", () => {
      if (escapeMode) {
        moveYesButton();
        return;
      }

      ask.classList.add("hidden");
      celebration.classList.remove("hidden");
    });

    no.addEventListener("click", () => {
      const url =
        "https://wa.me/" + whatsappNumber +
        "?text=" + encodeURIComponent(whatsappMessage);

      window.location.href = url;
    });

    document.getElementById("confirmDate").addEventListener("click", () => {
      const message = "(...)";
      window.location.href =
        "https://wa.me/" + whatsappNumber +
        "?text=" + encodeURIComponent(message);
    });

    // Reposiciona o botão caso a orientação do celular mude.
    window.addEventListener("resize", () => {
      if (yes.style.position === "fixed") {
        const rect = yes.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width - 16;
        const maxY = window.innerHeight - rect.height - 16;

        yes.style.left =
          Math.max(16, Math.min(rect.left, maxX)) + "px";
        yes.style.top =
          Math.max(16, Math.min(rect.top, maxY)) + "px";
      }
    });
  </script>

</body>
</html>
